version: "3.9"

services:
  analysis:
    image: cat-movement-analysis
    volumes:
      - ./plots:/app/plots

  tests:
    image: cat-movement-analysis
    entrypoint: pytest
    command: -v

  lint:
    image: cat-movement-analysis
    entrypoint: ruff
    command: check .

  format:
    image: cat-movement-analysis
    entrypoint: ruff
    command: format --check

  lint-fix:
    image: cat-movement-analysis
    entrypoint: ruff
    command: check . --fix
    volumes:
      - .:/app

  format-fix:
    image: cat-movement-analysis
    entrypoint: ruff
    command: format .
    volumes:
      - .:/app