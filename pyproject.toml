[project]
name = "ss2026-dsaap-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "folium>=0.20.0",
    "geopandas==1.1.3",
    "mapclassify>=2.10.0",
    "numpy>=2.4.4",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "suncalc>=0.1.3",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."] # needed for pytest, so that it knows where the code is, it can load the src module

[dependency-groups] # dependencies only needed for development and not for running the application
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
