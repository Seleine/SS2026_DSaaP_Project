[project]
name = "ss2026-dsaap-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "geopandas==1.1.3",
    "mapclassify>=2.10.0",
    "numpy>=1.26,<2.0.0",
    "matplotlib>=3.10.8",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "suncalc>=0.1.3",
    "seaborn>=0.13.2",
    "build>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
